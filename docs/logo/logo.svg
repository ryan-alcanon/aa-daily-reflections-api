<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>

    <!-- Background: deep navy, diagonal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1F3C"/>
      <stop offset="100%" stop-color="#1B3468"/>
    </linearGradient>

    <!-- Warm glow emanating from the sun -->
    <radialGradient id="glow" cx="256" cy="284" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F5A020" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5A020" stop-opacity="0"/>
    </radialGradient>

    <!-- Sun: bright center, amber edges -->
    <radialGradient id="sun" cx="256" cy="236" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFDE0"/>
      <stop offset="45%"  stop-color="#F5A825"/>
      <stop offset="100%" stop-color="#B86000"/>
    </radialGradient>

    <!-- Only render sun + rays above the book horizon -->
    <clipPath id="aboveHorizon">
      <rect x="0" y="0" width="512" height="284"/>
    </clipPath>

  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Subtle inner edge for depth -->
  <rect width="512" height="512" rx="112" ry="112"
        fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="3"/>

  <!-- Ambient warm glow -->
  <ellipse cx="256" cy="284" rx="260" ry="220" fill="url(#glow)"/>

  <!-- Rays fanning upward, clipped at horizon -->
  <g clip-path="url(#aboveHorizon)" stroke="#F5C535" stroke-linecap="round">
    <line x1="256" y1="284" x2="256" y2="114"  stroke-width="14" opacity="0.65"/>
    <line x1="256" y1="284" x2="362" y2="162"  stroke-width="11" opacity="0.50"/>
    <line x1="256" y1="284" x2="150" y2="162"  stroke-width="11" opacity="0.50"/>
    <line x1="256" y1="284" x2="414" y2="226"  stroke-width="9"  opacity="0.35"/>
    <line x1="256" y1="284" x2="98"  y2="226"  stroke-width="9"  opacity="0.35"/>
  </g>

  <!-- Rising sun: top semicircle only -->
  <circle cx="256" cy="284" r="96" fill="url(#sun)" clip-path="url(#aboveHorizon)"/>

  <!-- Open book — left page -->
  <path d="M 256 412 L 62 374 L 62 232 Q 158 260 256 284 Z"
        fill="#E2EFF7" opacity="0.95"/>

  <!-- Open book — right page -->
  <path d="M 256 412 L 450 374 L 450 232 Q 354 260 256 284 Z"
        fill="#C8DCE8" opacity="0.95"/>

  <!-- Spine -->
  <line x1="256" y1="284" x2="256" y2="412"
        stroke="#5C86A8" stroke-width="4" opacity="0.55"/>

</svg>
